name: Build animated profile header

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-animation.yml"
      - ".github/scripts/build_header.py"

permissions:
  contents: write

concurrency:
  group: animated-profile-header
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow==11.3.0

      - name: Generate the looping GIF
        run: python .github/scripts/build_header.py

      - name: Commit rendered asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neural-pulse.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: render profile animation [skip ci]"
            git push
          fi
